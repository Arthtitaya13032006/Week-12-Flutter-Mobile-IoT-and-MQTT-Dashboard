<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 780" width="100%" id="diagram-root" style="background:#ffffff; border-radius:10px; font-family:'Sarabun', 'TH Sarabun New', 'Prompt', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadowFilter" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <polygon points="0 1.5, 7 4.5, 0 7.5" fill="#475569" />
    </marker>
  </defs>
  <!-- Banner -->
  <g id="banner" filter="url(#shadowFilter)">
    <rect x="40" y="32" width="780" height="58" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.7"/>
    <text x="430" y="68" fill="#1e293b" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">โครงสร้างสถาปัตยกรรมของ Flutter</text>
  </g>
  <!-- Card Group: เลเยอร์ 1: Dart Framework -->
  <g id="card-group-1">
    <!-- Badge -->
    <rect x="40" y="112" width="286.5" height="28" rx="6" fill="#475569"/>
    <text x="54" y="131" fill="#ffffff" font-size="13" font-weight="700">เลเยอร์ 1: Dart Framework</text>
    <text x="338.5" y="131" fill="#94a3b8" font-size="13" font-weight="500">ระดับที่นักพัฒนาเขียนโค้ด</text>
    <!-- Card Container -->
    <rect x="40" y="148" width="780" height="142" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadowFilter)"/>
    <text x="62" y="174" font-size="14">
      <tspan fill="#334155" font-weight="600">UI Elements:</tspan>
      <tspan fill="#475569"> Material Design / Cupertino (iOS style)</tspan>
    </text>
    <text x="62" y="204" font-size="14">
      <tspan fill="#334155" font-weight="600">Widgets:</tspan>
      <tspan fill="#475569"> Container, Row, Column, StreamBuilder, AnimatedBuilder</tspan>
    </text>
    <text x="62" y="234" font-size="14">
      <tspan fill="#334155" font-weight="600">Rendering &amp; Painting:</tspan>
      <tspan fill="#475569"> RenderObject, Canvas, Layer Tree</tspan>
    </text>
    <text x="62" y="264" font-size="14">
      <tspan fill="#334155" font-weight="600">Foundation &amp; Animation:</tspan>
      <tspan fill="#475569"> Gestures, Physics, Scheduler, Services</tspan>
    </text>
  </g>
  <!-- Flow Connector -->
  <g id="connector-2">
    <line x1="430" y1="304" x2="430" y2="334" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
  </g>
  <!-- Card Group: เลเยอร์ 2: Flutter Engine (C++) -->
  <g id="card-group-3">
    <!-- Badge -->
    <rect x="40" y="354" width="349.5" height="28" rx="6" fill="#475569"/>
    <text x="54" y="373" fill="#ffffff" font-size="13" font-weight="700">เลเยอร์ 2: Flutter Engine (C++)</text>
    <text x="401.5" y="373" fill="#94a3b8" font-size="13" font-weight="500">เอนจินประมวลผลหลัก</text>
    <!-- Card Container -->
    <rect x="40" y="390" width="780" height="142" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadowFilter)"/>
    <text x="62" y="416" font-size="14">
      <tspan fill="#334155" font-weight="600">Graphics Pipeline:</tspan>
      <tspan fill="#475569"> Impeller / Skia 2D Graphics Engine</tspan>
    </text>
    <text x="62" y="446" font-size="14">
      <tspan fill="#334155" font-weight="600">Dart Runtime:</tspan>
      <tspan fill="#475569"> Memory Allocator, Garbage Collector, Event Loop</tspan>
    </text>
    <text x="62" y="476" font-size="14">
      <tspan fill="#334155" font-weight="600">Text Layout:</tspan>
      <tspan fill="#475569"> LibTxt / HarfBuzz Font Shaping Engine</tspan>
    </text>
    <text x="62" y="506" font-size="14">
      <tspan fill="#334155" font-weight="600">Platform Channels:</tspan>
      <tspan fill="#475569"> การส่งข้อความไบนารีระหว่าง Dart กับ Native OS</tspan>
    </text>
  </g>
  <!-- Flow Connector -->
  <g id="connector-4">
    <line x1="430" y1="546" x2="430" y2="576" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
  </g>
  <!-- Card Group: เลเยอร์ 3: Platform Embedder -->
  <g id="card-group-5">
    <!-- Badge -->
    <rect x="40" y="596" width="318" height="28" rx="6" fill="#475569"/>
    <text x="54" y="615" fill="#ffffff" font-size="13" font-weight="700">เลเยอร์ 3: Platform Embedder</text>
    <text x="370" y="615" fill="#94a3b8" font-size="13" font-weight="500">ตัวเชื่อมต่อกับฮาร์ดแวร์ของแต่ละ OS</text>
    <!-- Multi-Column Card Container -->
    <rect x="40" y="632" width="780" height="114" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadowFilter)"/>
    <!-- Sub-Column 1 -->
    <rect x="54" y="644" width="242.66666666666666" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="175.33333333333331" y="668" fill="#1e293b" font-size="13.5" font-weight="700" text-anchor="middle">Android (Java/C++)</text>
    <line x1="64" y1="676" x2="286.66666666666663" y2="676" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="68" y="702" fill="#475569" font-size="12.5">- Surface Render</text>
    <text x="68" y="726" fill="#475569" font-size="12.5">- Touch Events</text>
    <!-- Sub-Column 2 -->
    <rect x="308.66666666666663" y="644" width="242.66666666666666" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="429.99999999999994" y="668" fill="#1e293b" font-size="13.5" font-weight="700" text-anchor="middle">iOS (Objective-C/Swift)</text>
    <line x1="318.66666666666663" y1="676" x2="541.3333333333333" y2="676" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="322.66666666666663" y="702" fill="#475569" font-size="12.5">- Metal / OpenGL Surface</text>
    <text x="322.66666666666663" y="726" fill="#475569" font-size="12.5">- Lifecycle Management</text>
    <!-- Sub-Column 3 -->
    <rect x="563.3333333333333" y="644" width="242.66666666666666" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="684.6666666666666" y="668" fill="#1e293b" font-size="13.5" font-weight="700" text-anchor="middle">Windows/macOS/Linux/Web</text>
    <line x1="573.3333333333333" y1="676" x2="795.9999999999999" y2="676" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="577.3333333333333" y="702" fill="#475569" font-size="12.5">- Message Dispatch</text>
    <text x="577.3333333333333" y="726" fill="#475569" font-size="12.5">- Hardware Access</text>
  </g>
</svg>