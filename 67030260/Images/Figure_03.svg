<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1245 144" width="100%" id="diagram-root" style="background:#ffffff; border-radius:10px; font-family:'Sarabun', 'TH Sarabun New', 'Prompt', system-ui, sans-serif;">
  <defs>
    <filter id="shadowFilter" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <polygon points="0 1.5, 7 4.5, 0 7.5" fill="#0284c7" />
    </marker>
  </defs>
  <!-- Node 1: MQTT -->
  <g id="node-MQTT" filter="url(#shadowFilter)">
    <rect x="35" y="32" width="220" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="145" y="66" fill="#0369a1" font-size="14.5" font-weight="700" text-anchor="middle">MQTT Event Stream</text>
    <text x="145" y="89" fill="#64748b" font-size="12" font-weight="500" text-anchor="middle">ได้รับข้อความใหม่</text>
  </g>
  <!-- Node 2: State -->
  <g id="node-State" filter="url(#shadowFilter)">
    <rect x="439.5" y="32" width="220" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="549.5" y="66" fill="#0369a1" font-size="14.5" font-weight="700" text-anchor="middle">Application State</text>
    <text x="549.5" y="89" fill="#64748b" font-size="12" font-weight="500" text-anchor="middle">(voltage, ledStatus, isOnline)</text>
  </g>
  <!-- Node 3: Build -->
  <g id="node-Build" filter="url(#shadowFilter)">
    <rect x="714.5" y="32" width="220" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="824.5" y="66" fill="#0369a1" font-size="14.5" font-weight="700" text-anchor="middle">build(BuildContext)</text>
    <text x="824.5" y="89" fill="#64748b" font-size="12" font-weight="500" text-anchor="middle">ฟังก์ชันคำนวณโครงสร้าง UI</text>
  </g>
  <!-- Node 4: Screen -->
  <g id="node-Screen" filter="url(#shadowFilter)">
    <rect x="989.5" y="32" width="220" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1099.5" y="66" fill="#0369a1" font-size="14.5" font-weight="700" text-anchor="middle">Rendered Screen</text>
    <text x="1099.5" y="89" fill="#64748b" font-size="12" font-weight="500" text-anchor="middle">มาตรวัด, สวิตช์, ป้ายสถานะ</text>
  </g>
  <!-- Edge 0: MQTT -> State -->
  <g id="edge-0">
    <line x1="255" y1="72" x2="431.5" y2="72" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
    <rect x="265.25" y="61" width="156" height="22" rx="4" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="343.25" y="76.5" fill="#0369a1" font-size="11.5" font-weight="600" text-anchor="middle">setState / Notify</text>
  </g>
  <!-- Edge 1: State -> Build -->
  <g id="edge-1">
    <line x1="659.5" y1="72" x2="706.5" y2="72" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  </g>
  <!-- Edge 2: Build -> Screen -->
  <g id="edge-2">
    <line x1="934.5" y1="72" x2="981.5" y2="72" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  </g>
</svg>