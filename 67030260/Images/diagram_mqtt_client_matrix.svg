<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 322" width="100%" id="diagram-root" style="background:#ffffff; border-radius:8px; font-family:'Sarabun', 'TH Sarabun New', 'Prompt', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadowFilter" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <polygon points="0 1.5, 7 4.5, 0 7.5" fill="#0284c7" />
    </marker>
  </defs>
  <!-- Banner -->
  <g id="banner" filter="url(#shadowFilter)">
    <rect x="40" y="32" width="780" height="58" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="430" y="68" fill="#0369a1" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">คุณสมบัติและสถาปัตยกรรมของแพ็กเกจ mqtt_client</text>
  </g>
  <!-- Card Group: pub.dev: mqtt_client -->
  <g id="card-group-1">
    <!-- Badge -->
    <rect x="40" y="112" width="234" height="28" rx="6" fill="#0284c7"/>
    <text x="54" y="131" fill="#ffffff" font-size="13" font-weight="700">pub.dev: mqtt_client</text>
    <text x="286" y="131" fill="#64748b" font-size="13" font-weight="500">Dart MQTT v3.1.1 &amp; v5.0 Client Package</text>
    <!-- Multi-Column Card Container -->
    <rect x="40" y="148" width="780" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowFilter)"/>
    <!-- Sub-Column 1 -->
    <rect x="54" y="160" width="242.66666666666666" height="116" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="175.33333333333331" y="184" fill="#0284c7" font-size="13.5" font-weight="700" text-anchor="middle">โปรโตคอลเครือข่าย (Transport)</text>
    <line x1="64" y1="192" x2="286.66666666666663" y2="192" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="68" y="218" fill="#334155" font-size="12.5">- Raw TCP: พอร์ต 1883/8883</text>
    <text x="68" y="242" fill="#334155" font-size="12.5">- WebSocket: พอร์ต 8083/9001</text>
    <text x="68" y="266" fill="#334155" font-size="12.5">- รองรับการเข้ารหัส TLS/SSL</text>
    <!-- Sub-Column 2 -->
    <rect x="308.66666666666663" y="160" width="242.66666666666666" height="116" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="429.99999999999994" y="184" fill="#0284c7" font-size="13.5" font-weight="700" text-anchor="middle">โมเดลการประมวลผล (Reactive)</text>
    <line x1="318.66666666666663" y1="192" x2="541.3333333333333" y2="192" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="322.66666666666663" y="218" fill="#334155" font-size="12.5">- Asynchronous I/O</text>
    <text x="322.66666666666663" y="242" fill="#334155" font-size="12.5">- Dart Event Stream</text>
    <text x="322.66666666666663" y="266" fill="#334155" font-size="12.5">- Non-blocking Operations</text>
    <!-- Sub-Column 3 -->
    <rect x="563.3333333333333" y="160" width="242.66666666666666" height="116" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="684.6666666666666" y="184" fill="#0284c7" font-size="13.5" font-weight="700" text-anchor="middle">แพลตฟอร์มที่รองรับ (Platforms)</text>
    <line x1="573.3333333333333" y1="192" x2="795.9999999999999" y2="192" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="577.3333333333333" y="218" fill="#334155" font-size="12.5">- Mobile: Android, iOS</text>
    <text x="577.3333333333333" y="242" fill="#334155" font-size="12.5">- Desktop: Windows, macOS</text>
    <text x="577.3333333333333" y="266" fill="#334155" font-size="12.5">- Web: Flutter Web (WSS)</text>
  </g>
</svg>